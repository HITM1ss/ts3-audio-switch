; audio_follow.ini - SystemAudioFollow plugin configuration
; Located in the TeamSpeak 3 plugins folder (%APPDATA%\TS3Client\plugins\)
; You can also edit these via TeamSpeak 3 context menu -> Global -> "Audio Follow Settings..."

[General]
; Enable following the Windows default playback device (1=yes, 0=no)
Enabled=1

; Write plugin messages to the TeamSpeak 3 log (1=yes, 0=no)
LogEnabled=1
